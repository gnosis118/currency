# Presidential-level Netlify configuration for currencytocurrency.app
[build]
  publish = "dist"
  command = "npm install && npm run build"
# Functions directory for serverless handlers
[functions]
  directory = "netlify/functions"


[build.environment]
  NODE_VERSION = "18.19.0"
  NPM_VERSION = "10.2.4"
  NPM_FLAGS = "--production=false"
  # Build optimizations
  NODE_OPTIONS = "--max-old-space-size=4096"
  # Omit benign public identifiers from secrets scanning
  SECRETS_SCAN_OMIT_KEYS = "AUTH0_AUDIENCE,AUTH0_CLIENT_ID,AUTH0_DOMAIN,AUTH0_ISSUER_BASE_URL,SUPABASE_ANON_KEY"
  SECRETS_SCAN_OMIT_PATHS = "public/sitemap*.xml,public/robots.txt,dist/**"

# Production environment optimizations
[context.production.environment]
  DISABLE_NETLIFY_VISUAL_EDITOR = "true"
  NODE_ENV = "production"

# Development environment
[context.deploy-preview.environment]
  NODE_ENV = "development"

# Specific redirects for currency pairs (old format to new format)
[[redirects]]
  from = "/usd-to-eur"
  to = "/usd-eur"
  status = 301
  headers = {X-Robots-Tag = "index, follow"}

[[redirects]]
  from = "/usd-to-gbp"
  to = "/usd-gbp"
  status = 301

[[redirects]]
  from = "/usd-to-jpy"
  to = "/usd-jpy"
  status = 301

[[redirects]]
  from = "/usd-to-cad"
  to = "/usd-cad"
  status = 301

[[redirects]]
  from = "/usd-to-aud"
  to = "/usd-aud"
  status = 301

[[redirects]]
  from = "/usd-to-chf"
  to = "/usd-chf"
  status = 301

[[redirects]]
  from = "/gbp-to-usd"
  to = "/gbp-usd"
  status = 301

[[redirects]]
  from = "/eur-to-usd"
  to = "/eur-usd"
  status = 301

[[redirects]]
  from = "/eur-to-gbp"
  to = "/eur-gbp"
  status = 301

[[redirects]]
  from = "/eur-to-jpy"
  to = "/eur-jpy"
  status = 301

[[redirects]]
  from = "/jpy-to-usd"
  to = "/jpy-usd"
  status = 301

[[redirects]]
  from = "/aud-to-usd"
  to = "/aud-usd"
  status = 301

[[redirects]]
  from = "/cad-to-usd"
  to = "/cad-usd"
  status = 301

[[redirects]]
  from = "/chf-to-usd"
  to = "/chf-usd"
  status = 301

[[redirects]]
  from = "/nzd-to-usd"
  to = "/nzd-usd"
  status = 301

[[redirects]]
  from = "/sek-to-usd"
  to = "/sek-usd"
  status = 301

# Catch-all redirect for SPA (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  headers = {X-Robots-Tag = "index, follow"}

# Ensure proper content types for SEO
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    X-Robots-Tag = "index, follow"

# Admin redirect for Netlify CMS
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Presidential-level security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Performance headers
    X-DNS-Prefetch-Control = "on"
    # SEO headers
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/webp"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/jpeg"

